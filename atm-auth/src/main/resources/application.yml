eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://192.168.137.2:8761/eureka/
  instance:
    prefer-ip-address: true

jwt:
  secret: your-secret-key
  expiration: 86400000  # 24小时 