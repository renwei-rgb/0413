spring:
  cloud:
    config:
      server:
        git:
          uri: ${CONFIG_GIT_URI:https://github.com/your-repo/config-repo}
          default-label: dev
          search-paths: '{application}'
          clone-on-start: true
          timeout: 10
          basedir: ${CONFIG_BASEDIR:./config-repo}
          force-pull: true

logging:
  level:
    root: INFO
    com.tss.atm: DEBUG
    org.springframework.cloud.config: DEBUG 