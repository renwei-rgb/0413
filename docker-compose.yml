version: '3'
services:
  nacos:
    image: nacos/nacos-server:2.0.3
    container_name: nacos
    environment:
      - MODE=standalone
      - SPRING_DATASOURCE_PLATFORM=mysql
      - MYSQL_SERVICE_HOST=atm-mysql
      - MYSQL_SERVICE_PORT=3306
      - MYSQL_SERVICE_USER=root
      - MYSQL_SERVICE_PASSWORD=root
      - MYSQL_SERVICE_DB_NAME=nacos
      - NACOS_AUTH_TOKEN=In5hswZ8ZEqCp2qyiAQpQ7rao42LoK9VvJwmeD3arTQ=
      - NACOS_AUTH_ENABLED=false
    ports:
      - "18848:8848"
      - "19848:9848"
      - "19849:9849"
    depends_on:
      - mysql
    networks:
      - atm-network

  mysql:
    image: mysql:8.0
    container_name: atm-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=nacos
    ports:
      - "13306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - atm-network

  eureka:
    build: ./atm-eureka
    ports:
      - "8761:8761"
    networks:
      - atm-network
    environment:
      - EUREKA_INSTANCE_HOSTNAME=eureka
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8761/eureka/

  gateway:
    build: ./atm-gateway
    ports:
      - "8082:8082"
    networks:
      - atm-network
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8761/eureka/
    depends_on:
      - eureka

  nginx:
    image: nginx:latest
    container_name: atm-nginx
    ports:
      - "8085:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./tss-atm-web-vue/dist:/usr/share/nginx/html
    depends_on:
      - gateway
    networks:
      - atm-network

networks:
  atm-network:
    driver: bridge

volumes:
  mysql-data: 