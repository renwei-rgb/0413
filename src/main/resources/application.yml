server:
  port: 8080

spring:
  application:
    name: atm-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true  # 开启从注册中心动态创建路由的功能
          lower-case-service-id: true  # 使用小写服务名，默认是大写
      routes:
        - id: auth-service
          uri: lb://atm-auth
          predicates:
            - Path=/auth/**
        - id: user-service
          uri: lb://atm-user
          predicates:
            - Path=/user/**
        - id: check-service
          uri: lb://atm-check
          predicates:
            - Path=/check/**
        - id: report-service
          uri: lb://atm-report
          predicates:
            - Path=/report/**

eureka:
  client:
    service-url:
      defaultZone: http://eureka:8761/eureka/
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

mybatis-plus:
  mapper-locations: classpath:/mapper/**/*.xml   # XML 路径（如果使用）
  type-aliases-package: com.example.demo.entity  # 实体类包
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # 打印SQL日志
